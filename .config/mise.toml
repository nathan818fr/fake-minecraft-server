[settings]
lockfile = true

# Renovate keeps mise.lock on the latest versions within these ranges.
[tools]
go = "1"
golangci-lint = "2"
dprint = "0"

[tasks.dev]
description = "Run the server from source"
run = "go run ./cmd/fake-minecraft-server"

[tasks.fmt]
description = "Format the code and the documentation"
run = ["golangci-lint fmt --config .config/golangci.yaml", "dprint fmt"]

[tasks.lint]
description = "Run golangci-lint, which also checks formatting, and dprint check"
run = ["golangci-lint run --config .config/golangci.yaml", "dprint check"]

[tasks.test]
description = "Run the tests with the race detector"
run = "go test -race ./..."

[tasks.bench]
description = "Run the benchmarks"
run = "go test -run '^$' -bench . -benchmem ./..."

[tasks.screenshots]
description = "Take the screenshots of the documentation in Minecraft, in a headless Wayland compositor (Linux)"
tools = { java = "temurin-25", uv = "0" }
# Not in tools: mise cannot install the conda tools of a task from the lockfile.
run = "mise x conda:weston@16.0.0 conda:xwayland@24.1.14 conda:xdotool@4.20260303.1 -- uv run --script tools/screenshots.py"

[tasks.check]
description = "Run everything CI runs"
depends = ["lint", "test"]

[tasks.image]
description = "Build the container image, for linux/amd64 and linux/arm64"
run = '''
image="${IMAGE:-localhost/fake-minecraft-server}"
version="$(git describe --tags --always --dirty)"
go_version="$(go env GOVERSION)"
go_version="${go_version#go}"
if podman manifest exists "$image"; then podman manifest rm "$image" >/dev/null; fi
podman build --platform linux/amd64,linux/arm64 --manifest "$image" \
  --build-arg VERSION="$version" \
  --build-arg GO_VERSION="$go_version" \
  --timestamp "$(git log -1 --format=%ct)" \
  --label "org.opencontainers.image.version=$version" \
  --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
  .
'''
