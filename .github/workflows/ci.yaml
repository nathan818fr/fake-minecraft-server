name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: &unrelated-paths
      - LICENSE
      - .gitignore
      - .github/renovate.json5
  pull_request:
    paths-ignore: *unrelated-paths
  workflow_call:

permissions:
  contents: read

env:
  # Else installing a tool re-locks them all, which can change mise.lock.
  MISE_LOCKED: "1"

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Check
    # The pushes to this repository check its pull requests already.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Cache Go modules and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', '.config/mise.lock') }}
          restore-keys: go-${{ runner.os }}-

      - name: Check
        run: mise run check

      - name: Build binaries
        run: mise run dist

      - name: Build image
        run: mise run --skip-deps image
