name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

env:
  # Else installing a tool re-locks them all, and GoReleaser refuses the dirty
  # mise.lock.
  MISE_LOCKED: "1"

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  release:
    name: Release
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All the tags, for GoReleaser and to check that releases go forward.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      # First, as it refuses a version older than a release.
      - name: Upload binaries to a draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run release

      - name: Build image
        # Without the snapshot build of dist, which would replace the release's
        # archives.
        run: mise run --skip-deps image

      - name: Push image
        id: push
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          # Docker's file, which the attestation reads too; podman falls back
          # to it.
          podman login \
            --authfile "${HOME}/.docker/config.json" \
            --username "$GITHUB_ACTOR" \
            --password-stdin \
            -- "${IMAGE%%/*}" <<<"$REGISTRY_TOKEN"
          tags=("$GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            tags+=("${GITHUB_REF_NAME%%.*}" latest)
          fi
          for tag in "${tags[@]}"; do
            podman manifest push \
              --all \
              --digestfile "${RUNNER_TEMP}/digest" \
              -- "$IMAGE" "docker://${IMAGE}:${tag}"
          done
          printf '%s=%s\n' digest "$(cat -- "${RUNNER_TEMP}/digest")" >>"$GITHUB_OUTPUT"

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest binary provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # Last, so that a failed release leaves only a draft, which a new run
      # replaces.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=true
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then latest=false; fi
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest="$latest"
